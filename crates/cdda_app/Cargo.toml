[package]
name = "cdda_app"
version = "0.1.0"
edition = "2021"
description = "Binary entry point – App::new() + plugin registration."

[[bin]]
name = "cdda"
path = "src/main.rs"

[dependencies]
clap.workspace = true
cdda_core.workspace = true
cdda_components.workspace = true
cdda_activity.workspace = true
cdda_render.workspace = true
bevy = { workspace = true, features = ["3d"] }
bevy-inspector-egui.workspace = true
bevy_egui = { version = "0.39" }
bevy_state = "0.18"
tracing.workspace = true
bevy_mod_debugdump = "0.15.0"

[features]
default = ["dynamic"]
dynamic = ["bevy/dynamic_linking"]

[dev-dependencies]
