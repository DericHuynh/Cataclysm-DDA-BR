[package]
name = "cdda_render"
version = "0.1.0"
edition = "2021"
description = "CDDA UI rendering — all bevy_ui, Text2d, and tile rendering."

[dependencies]
cdda_core = { path = "../cdda_core" }
cdda_components = { path = "../cdda_components" }
cdda_overmap = { path = "../cdda_overmap" }
bevy = { workspace = true, default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_render",
    "bevy_sprite", "bevy_text", "bevy_ui", "bevy_winit", "x11",
] }
bevy_ecs.workspace = true
bevy_state.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
leafwing-input-manager.workspace = true
