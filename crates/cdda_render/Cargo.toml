[package]
name = "cdda_render"
version = "0.1.0"
edition = "2021"
description = "Bevy rendering plugin – tiles, UI, ASCII mode. Uses standard bevy_ui for all UI."

[dependencies]
cdda_sim.workspace = true
cdda_map.workspace = true
cdda_core.workspace = true
cdda_ui = { path = "../cdda_ui" }
bevy_state = "0.18"
cdda_input.workspace = true
cdda_actor = { path = "../cdda_actor" }
cdda_item = { path = "../cdda_item" }
bevy = { workspace = true, features = ["2d", "bevy_input_focus"] }
bevy-inspector-egui = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
default = ["inspector"]
inspector = ["bevy-inspector-egui"]

[dev-dependencies]
