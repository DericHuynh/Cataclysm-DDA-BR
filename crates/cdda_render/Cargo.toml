[package]
name = "cdda_render"
version = "0.1.0"
edition = "2021"
description = "CDDA UI rendering — all bevy_ui, Text2d, and tile rendering."

[dependencies]
cdda_ui.workspace = true
cdda_components = { path = "../cdda_components" }
cdda_context = { path = "../cdda_context" }
cdda_core_types = { path = "../cdda_core_types" }
cdda_data = { path = "../cdda_data" }
cdda_input = { path = "../cdda_input" }
cdda_overmap = { path = "../cdda_overmap" }
cdda_overmap_gen = { path = "../cdda_overmap_gen" }
cdda_sim = { path = "../cdda_sim" }
bevy = { workspace = true, default-features = false, features = [
    "bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_render",
    "bevy_sprite", "bevy_text", "bevy_ui", "bevy_winit", "x11",
    "ui_picking",
] }
bevy_ecs.workspace = true
bevy_state.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
leafwing-input-manager.workspace = true
