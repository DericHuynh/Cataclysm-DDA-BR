[package]
name = "cdda_sim"
version = "0.1.0"
edition = "2021"
description = "Game simulation: state machine, test harness, and the consolidated actor/AI/activity/combat/crafting/equipment/inventory/item/noise submodules."

[dependencies]
bevy_ecs.workspace = true
bevy_reflect.workspace = true
bevy_app.workspace = true
bevy_state.workspace = true
bevy_input = { workspace = true, features = ["keyboard"] }
serde.workspace = true
cdda_core_types = { path = "../cdda_core_types" }
cdda_components = { path = "../cdda_components" }
cdda_events = { path = "../cdda_events" }
cdda_data = { path = "../cdda_data" }
tracing.workspace = true

[dev-dependencies]
cdda_components.workspace = true
cdda_core_types.workspace = true
cdda_data.workspace = true
bevy_ecs.workspace = true
