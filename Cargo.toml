[workspace]
resolver = "2"
members = [
    "crates/cdda_cli",
    "crates/cdda_app",
    "crates/cdda_render",
    "crates/cdda_core_types",
    "crates/cdda_components",
    "crates/cdda_overmap",
    "crates/cdda_overmap_gen",
    "crates/cdda_sim",
    "crates/cdda_replay",
    "crates/cdda_context",
    "crates/cdda_data",
    "crates/cdda_defs_raw",
    "crates/cdda_htn",
    "crates/cdda_input",
    "crates/cdda_integration_tests",
]

[workspace.dependencies]
# Bevy 0.18
bevy_ecs        = { version = "0.18", features = ["multi_threaded"] }
bevy_reflect    = "0.18"
bevy_app        = "0.18"
bevy_asset      = { version = "0.18", features = ["file_watcher"] }
bevy_input      = { version = "0.18", features = ["keyboard"] }
bevy_time       = "0.18"
bevy_state      = "0.18"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
schemars        = { version = "0.8", features = ["derive"] }
thiserror       = "2"
indexmap        = "2"
pest            = "2"
pest_derive     = "2"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
smallvec        = "1"
ustr            = "1.1"
rstar           = "0.12"
clap            = { version = "4", features = ["derive"] }
pathfinding     = "4"
postcard        = { version = "1", features = ["alloc"] }
tempfile        = "3.27.0"

# Benchmarking
criterion        = "0.8"

# Bevy ecosystem
bevy                = { version = "0.18", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_sprite", "bevy_text", "bevy_ui", "bevy_winit", "x11", "bevy_gilrs"] }
bevy_lunex          = "0.6"
bevy_fast_tilemap         = "0.18"
bevy-inspector-egui       = "0.36"
leafwing-input-manager    = "0.20"

# Internal workspace crates
cdda_cli = { path = "crates/cdda_cli" }
cdda_app     = { path = "crates/cdda_app" }
cdda_render  = { path = "crates/cdda_render" }
cdda_components = { path = "crates/cdda_components" }
cdda_core_types = { path = "crates/cdda_core_types" }
cdda_overmap = { path = "crates/cdda_overmap" }
cdda_overmap_gen = { path = "crates/cdda_overmap_gen" }
cdda_sim = { path = "crates/cdda_sim" }
cdda_replay = { path = "crates/cdda_replay" }
cdda_context = { path = "crates/cdda_context" }
cdda_data = { path = "crates/cdda_data" }
cdda_input = { path = "crates/cdda_input" }
cdda_integration_tests = { path = "crates/cdda_integration_tests" }
cdda_defs_raw = { path = "crates/cdda_defs_raw" }
cdda_htn     = { path = "crates/cdda_htn" }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
