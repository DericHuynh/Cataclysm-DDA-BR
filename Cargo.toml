[workspace]
resolver = "2"
members = [
    "crates/cdda_cli",
    "crates/cdda_core",
    "crates/cdda_app",
]

[workspace.dependencies]
# Bevy 0.18
bevy_ecs        = "0.18"
bevy_reflect    = "0.18"
bevy_app        = "0.18"
bevy_asset      = "0.18"
bevy_input      = { version = "0.18", features = ["keyboard"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
schemars        = { version = "0.8", features = ["derive"] }
thiserror       = "2"
indexmap        = "2"
rand            = "0.9"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter"] }
smallvec        = "1"
rstar           = "0.12"
clap            = { version = "4", features = ["derive"] }
pathfinding     = "4"
postcard        = { version = "1", features = ["alloc"] }

# Bevy ecosystem
bevy                = { version = "0.18", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_sprite", "bevy_text", "bevy_ui", "bevy_winit", "x11", "bevy_gilrs"] }
bevy_lunex          = "0.6"
bevy_fast_tilemap         = "0.18"
bevy-inspector-egui       = "0.36"
leafwing-input-manager    = "0.20"

# Internal workspace crates
cdda_core   = { path = "crates/cdda_core" }
cdda_cli = { path = "crates/cdda_cli" }
cdda_app     = { path = "crates/cdda_app" }

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
